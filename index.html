            const DEFAULT_PROFILE = {
                name: '山月',
                bio: '🌿 前端开发者 · 写作爱好者',
                avatar: 'https://picsum.photos/seed/profile/200/200'
            };

            // ============================================================
            // 2. 数据管理 (localStorage)
            // ============================================================
            function loadData(key, defaultVal) {
                try {
                    const raw = localStorage.getItem(key);
                    if (raw) return JSON.parse(raw);
                } catch (_) { /* ignore */ }
                return defaultVal;
            }

            function saveData(key, data) {
                localStorage.setItem(key, JSON.stringify(data));
            }

            let posts = loadData('blog_posts', DEFAULT_POSTS);
            if (!localStorage.getItem('blog_posts')) {
                saveData('blog_posts', DEFAULT_POSTS);
                posts = DEFAULT_POSTS;
            }

            let profile = loadData('blog_profile', DEFAULT_PROFILE);
            if (!localStorage.getItem('blog_profile')) {
                saveData('blog_profile', DEFAULT_PROFILE);
                profile = DEFAULT_PROFILE;
            }

            function getNextId() {
                const ids = posts.map(p => p.id);
                return ids.length ? Math.max(...ids) + 1 : 1;
            }

            // ============================================================
            // 3. 工具函数：将文本中的 URL 转为带 data-url 的 span
            // ============================================================
            function linkifyUrls(text) {
                if (!text) return text;
                // 匹配 http/https/ftp 开头的 URL（不包含尾随标点）
                const urlRegex = /(https?:\/\/[^\s<]+)/g;
                return text.replace(urlRegex, function(url) {
                    // 移除可能的尾随标点（但保留 .com 等）
                    return `<span class="url-link" data-url="${url}" title="按住 Ctrl 单击打开链接">${url}</span>`;
                });
            }

            // ============================================================
            // 4. 渲染函数
            // ============================================================

            function updateProfileUI() {
                const p = profile;
                document.getElementById('heroName').textContent = p.name;
                document.getElementById('heroBio').textContent = p.bio;
                document.getElementById('heroAvatar').src = p.avatar || 'https://picsum.photos/seed/avatar/200/200';
                document.getElementById('sidebarName').textContent = p.name;
                document.getElementById('sidebarBio').textContent = p.bio;
                document.getElementById('sidebarAvatar').src = p.avatar || 'https://picsum.photos/seed/profile/200/200';
                document.querySelector('.nav-brand a').textContent = p.name || '山月集';
                document.querySelector('.footer .copy').innerHTML =
                    `&copy; ${new Date().getFullYear()} ${p.name || '山月集'} · 保留所有权利`;
            }

            function renderPostList(filter = '') {
                const keyword = filter.trim().toLowerCase();
                let filtered = [...posts];
                if (keyword) {
                    filtered = filtered.filter(p =>
                        p.title.toLowerCase().includes(keyword) ||
                        (p.excerpt && p.excerpt.toLowerCase().includes(keyword)) ||
                        (p.content && p.content.toLowerCase().includes(keyword)) ||
                        p.tags.some(t => t.toLowerCase().includes(keyword))
                    );
                }
                filtered.sort((a, b) => {
                    const da = new Date(a.date.replace(/年/g, '/').replace(/月/g, '/').replace(/日/g, ''));
                    const db = new Date(b.date.replace(/年/g, '/').replace(/月/g, '/').replace(/日/g, ''));
                    return db - da;
                });

                const container = document.getElementById('postItems');

                if (filtered.length === 0) {
                    container.innerHTML = `
                            <div class="no-results-inline">
                                <i class="fas fa-search" aria-hidden="true"></i>
                                没有找到匹配的内容，试试其他关键词吧。
                            </div>
                        `;
                } else {
                    container.innerHTML = filtered.map((p, index) => {
                        const isLink = p.type === 'link';
                        const linkBadge = isLink ?
                            `<span class="link-badge"><i class="fas fa-external-link-alt"></i> 链接</span>` :
                            '';
                        const externalIcon = isLink ?
                            `<i class="fas fa-external-link-alt external-icon" aria-hidden="true"></i>` :
                            '';
                        return `
                                <article class="post-card" data-id="${p.id}" data-type="${p.type}" style="animation-delay: ${index * 0.06}s;">
                                    <div class="post-meta">
                                        <span class="date"><i class="far fa-calendar-alt" aria-hidden="true"></i> ${p.date}</span>
                                        ${p.readTime ? `<span class="read-time"><i class="far fa-clock" aria-hidden="true"></i> ${p.readTime}</span>` : ''}
                                        ${linkBadge}
                                    </div>
                                    <h2>
                                        <a>${p.title}</a>
                                        ${externalIcon}
                                    </h2>
                                    ${p.excerpt ? `<p class="post-excerpt">${p.excerpt}</p>` : ''}
                                    <div class="post-tags">
                                        ${p.tags.map(t => `<span class="tag">#${t}</span>`).join('')}
                                    </div>
                                </article>
                            `;
                    }).join('');

                    container.querySelectorAll('.post-card').forEach(card => {
                        card.addEventListener('click', function(e) {
                            if (e.target.closest('.tag') || e.target.closest('a')) return;
                            const id = parseInt(this.dataset.id);
                            showPostDetail(id);
                        });
                        card.querySelector('h2 a').addEventListener('click', function(e) {
                            e.preventDefault();
                            const id = parseInt(this.closest('.post-card').dataset.id);
                            showPostDetail(id);
                        });
                    });
                }

                // 更新热门
                const sortedAll = [...posts].sort((a, b) => {
                    const da = new Date(a.date.replace(/年/g, '/').replace(/月/g, '/').replace(/日/g, ''));
                    const db = new Date(b.date.replace(/年/g, '/').replace(/月/g, '/').replace(/日/g, ''));
                    return db - da;
                });
                const top3 = sortedAll.slice(0, 3);
                const hotList = document.getElementById('hotList');
                hotList.innerHTML = top3.map((p, i) => {
                    const isLink = p.type === 'link';
                    return `
                            <li>
                                <span class="rank ${i === 0 ? 'top' : ''}">${i + 1}</span>
                                <a data-id="${p.id}" data-type="${p.type}">${p.title} ${isLink ? '🔗' : ''}</a>
                            </li>
                        `;
                }).join('');
                hotList.querySelectorAll('a').forEach(a => {
                    a.addEventListener('click', function(e) {
                        e.preventDefault();
                        const id = parseInt(this.dataset.id);
                        showPostDetail(id);
                    });
                });

                const allTags = new Set();
                posts.forEach(p => p.tags.forEach(t => allTags.add(t)));
                const tagCloud = document.getElementById('tagCloud');
                tagCloud.innerHTML = Array.from(allTags).map(t =>
                    `<span class="tag">#${t}</span>`
                ).join('');
            }

            // 3.3 创建新文章 (仅管理员)
            function createNewPost() {
                if (currentMode !== 'admin') return;
                const newPost = {
                    id: getNextId(),
                    type: 'post',
                    title: '新文章标题',
                    date: new Date().toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric' }),
                    readTime: '3 分钟',
                    excerpt: '请输入文章摘要……',
                    content: '请输入正文内容……',
                    tags: ['未分类'],
                    cover: 'https://picsum.photos/seed/new/600/340',
                    url: null
                };
                posts.push(newPost);
                saveData('blog_posts', posts);
                renderPostList(document.getElementById('searchInput').value);
                showPostDetail(newPost.id);
                setTimeout(() => {
                    const editBtn = document.querySelector('#editPostBtn');
                    if (editBtn) editBtn.click();
                }, 150);
            }

            function createNewLink(title, url, desc, tags) {
                if (currentMode !== 'admin') return;
                const newLink = {
                    id: getNextId(),
                    type: 'link',
                    title: title.trim() || '未命名链接',
                    date: new Date().toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric' }),
                    readTime: null,
                    excerpt: desc ? desc.trim() : '',
                    content: null,
                    tags: tags.length ? tags : ['链接'],
                    cover: null,
                    url: url.trim()
                };
                posts.push(newLink);
                saveData('blog_posts', posts);
                renderPostList(document.getElementById('searchInput').value);
                showPostDetail(newLink.id);
            }

            // ============================================================
            // 5. 显示文章详情（核心修改：支持 URL 链接化）
            // ============================================================
            function showPostDetail(postId) {
                const post = posts.find(p => p.id === postId);
                if (!post) return;

                switchPage('detail');

                const container = document.getElementById('postDetailContainer');

                let contentHtml = '';
                if (post.type === 'link') {
                    // 链接类型保持原样
                    contentHtml = `
                            <div style="background:var(--tag-bg);padding:16px 20px;border-radius:8px;margin-bottom:16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
                                <i class="fas fa-link" style="color:var(--link-color);font-size:1.20rem;"></i>
                                <span style="word-break:break-all;">${post.url || '无网址'}</span>
                                ${post.url ? `<a href="${post.url}" target="_blank" class="btn-link-visit" style="padding:4px 16px;border-radius:40px;background:var(--link-color);color:#fff;font-size:0.85rem;font-weight:600;margin-left:auto;">访问链接 <i class="fas fa-external-link-alt"></i></a>` : ''}
                            </div>
                            ${post.content ? `<div class="post-content">${post.content.replace(/\n/g, '<br>')}</div>` : '<p style="color:var(--text-secondary);">暂无描述</p>'}
                        `;
                } else {
                    // 文章类型：对内容进行链接化
                    if (post.content) {
                        // 先链接化，再转换行
                        const linked = linkifyUrls(post.content);
                        contentHtml = `<div class="post-content">${linked.replace(/\n/g, '<br>')}</div>`;
                    } else {
                        contentHtml = '<p style="color:var(--text-secondary);">暂无正文</p>';
                    }
                }

                container.innerHTML = `
                        <div class="post-detail" data-id="${post.id}">
                            <a class="back-link" id="backToHome"><i class="fas fa-arrow-left"></i> 返回文章列表</a>
                            <div class="post-title">${post.title}</div>
                            <div class="post-meta">
                                <span><i class="far fa-calendar-alt"></i> ${post.date}</span>
                                ${post.readTime ? `<span><i class="far fa-clock"></i> ${post.readTime}</span>` : ''}
                                <span>${post.tags.map(t => `#${t}`).join(' ')}</span>
                                ${post.type === 'link' ? '<span class="link-badge"><i class="fas fa-external-link-alt"></i> 链接</span>' : ''}
                            </div>
                            ${contentHtml}
                            <div class="post-actions">
                                <button id="editPostBtn" data-id="${post.id}"><i class="fas fa-edit"></i> 编辑</button>
                                <button id="deletePostBtn" class="btn-danger" data-id="${post.id}"><i class="fas fa-trash"></i> 删除</button>
                                <button id="newPostBtn" class="btn-outline"><i class="fas fa-plus"></i> 新建</button>
                                ${post.type === 'link' && post.url ? `<a href="${post.url}" target="_blank" class="btn-link-visit" style="padding:8px 24px;border-radius:40px;background:var(--link-color);color:#fff;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:6px;">访问链接 <i class="fas fa-external-link-alt"></i></a>` : ''}
                            </div>
                            <div id="editFormContainer" style="display:none; margin-top:24px;"></div>
                        </div>
                    `;

                // --- 事件绑定 ---
                container.querySelector('#backToHome').addEventListener('click', function(e) {
                    e.preventDefault();
                    switchPage('home');
                    renderPostList(document.getElementById('searchInput').value);
                });

                const editBtn = container.querySelector('#editPostBtn');
                const deleteBtn = container.querySelector('#deletePostBtn');
                const newBtn = container.querySelector('#newPostBtn');

                editBtn.addEventListener('click', function() {
                    if (currentMode !== 'admin') return;
                    const id = parseInt(this.dataset.id);
                    showEditForm(id);
                });

                deleteBtn.addEventListener('click', function() {
                    if (currentMode !== 'admin') return;
                    const id = parseInt(this.dataset.id);
                    if (confirm('确定要删除这条内容吗？')) {
                        posts = posts.filter(p => p.id !== id);
                        saveData('blog_posts', posts);
                        switchPage('home');
                        renderPostList(document.getElementById('searchInput').value);
                    }
                });

                newBtn.addEventListener('click', function() {
                    if (currentMode !== 'admin') return;
                    openNewChoiceModal();
                });

                // --- 新增：为所有 .url-link 绑定 Ctrl+单击 事件 ---
                container.querySelectorAll('.url-link').forEach(el => {
                    el.addEventListener('click', function(e) {
                        if (e.ctrlKey) {
                            const url = this.dataset.url;
                            if (url) {
                                window.open(url, '_blank');
                                e.preventDefault(); // 阻止可能的默认行为
                            }
                        } else {
                            // 非 Ctrl 单击时，可以忽略或显示提示（不干扰其他操作）
                            // 这里不做额外处理，保持无反应
                        }
                    });
                });
            }

            // ============================================================
            // 6. 编辑表单（仅管理员）
            // ============================================================
            function showEditForm(postId) {
                if (currentMode !== 'admin') return;
                const post = posts.find(p => p.id === postId);
                if (!post) return;

                const container = document.getElementById('editFormContainer');
                container.style.display = 'block';

                const isLink = post.type === 'link';
                const contentField = isLink ? `
                            <div>
                                <label for="editUrl">网址</label>
                                <input type="url" id="editUrl" value="${post.url || ''}" />
                            </div>
                            <div>
                                <label for="editContent">描述 (可选)</label>
                                <textarea id="editContent" rows="3">${post.content || ''}</textarea>
                            </div>
                        ` : `
                            <div>
                                <label for="editExcerpt">摘要</label>
                                <textarea id="editExcerpt" rows="2">${post.excerpt || ''}</textarea>
                            </div>
                            <div>
                                <label for="editContent">正文 (支持换行)</label>
                                <textarea id="editContent" rows="6">${post.content || ''}</textarea>
                            </div>
                            <div>
                                <label for="editReadTime">阅读时长</label>
                                <input type="text" id="editReadTime" value="${post.readTime || '3 分钟'}" />
                            </div>
                        `;

                container.innerHTML = `
                        <form class="edit-form" id="editForm">
                            <div class="form-row">
                                <div>
                                    <label for="editTitle">标题</label>
                                    <input type="text" id="editTitle" value="${post.title}" />
                                </div>
                                <div>
                                    <label for="editDate">日期</label>
                                    <input type="text" id="editDate" value="${post.date}" />
                                </div>
                            </div>
                            ${contentField}
                            <div>
                                <label for="editTags">标签 (用英文逗号分隔)</label>
                                <input type="text" id="editTags" value="${post.tags.join(', ')}" />
                            </div>
                            <button type="submit" class="btn-save"><i class="fas fa-save"></i> 保存修改</button>
                            <button type="button" class="btn-outline" id="cancelEdit" style="margin-left:12px;padding:10px 24px;border-radius:40px;border:1px solid var(--border);background:transparent;color:var(--text-secondary);cursor:pointer;">取消</button>
                        </form>
                    `;

                container.querySelector('#cancelEdit').addEventListener('click', function() {
                    container.style.display = 'none';
                });

                container.querySelector('#editForm').addEventListener('submit', function(e) {
                    e.preventDefault();
                    const updated = {
                        id: post.id,
                        type: post.type,
                        title: document.getElementById('editTitle').value.trim() || '未命名',
                        date: document.getElementById('editDate').value.trim() || new Date().toLocaleDateString(
                            'zh-CN'),
                        tags: document.getElementById('editTags').value.split(',').map(s => s.trim()).filter(
                            Boolean),
                        cover: post.cover || null,
                        url: post.url || null,
                        readTime: post.readTime || null,
                        excerpt: post.excerpt || '',
                        content: post.content || ''
                    };
                    if (isLink) {
                        updated.url = document.getElementById('editUrl').value.trim() || '#';
                        updated.content = document.getElementById('editContent').value.trim() || '';
                        updated.excerpt = updated.content;
                        updated.readTime = null;
                    } else {
                        updated.excerpt = document.getElementById('editExcerpt').value.trim() || '无摘要';
                        updated.content = document.getElementById('editContent').value.trim() || '无内容';
                        updated.readTime = document.getElementById('editReadTime').value.trim() || '3 分钟';
                    }
                    const index = posts.findIndex(p => p.id === postId);
                    if (index !== -1) {
                        posts[index] = updated;
                        saveData('blog_posts', posts);
                    }
                    showPostDetail(postId);
                    renderPostList(document.getElementById('searchInput').value);
                });
            }

            // ============================================================
            // 7. 新建选择模态框（仅管理员）
            // ============================================================
            const choiceModal = document.getElementById('newChoiceModal');
            const linkModal = document.getElementById('newLinkModal');

            function openNewChoiceModal() {
                if (currentMode !== 'admin') return;
                choiceModal.classList.add('open');
            }

            function closeChoiceModal() {
                choiceModal.classList.remove('open');
            }

            document.getElementById('closeChoiceModal').addEventListener('click', closeChoiceModal);
            choiceModal.addEventListener('click', function(e) {
                if (e.target === this) closeChoiceModal();
            });

            document.getElementById('choicePost').addEventListener('click', function() {
                closeChoiceModal();
                createNewPost();
            });

            document.getElementById('choiceLink').addEventListener('click', function() {
                closeChoiceModal();
                document.getElementById('linkTitle').value = '';
                document.getElementById('linkUrl').value = '';
                document.getElementById('linkDesc').value = '';
                document.getElementById('linkTags').value = '';
                linkModal.classList.add('open');
            });

            document.getElementById('closeLinkModal').addEventListener('click', function() {
                linkModal.classList.remove('open');
            });
            document.getElementById('cancelLink').addEventListener('click', function() {
                linkModal.classList.remove('open');
            });
            linkModal.addEventListener('click', function(e) {
                if (e.target === this) linkModal.classList.remove('open');
            });

            document.getElementById('newLinkForm').addEventListener('submit', function(e) {
                if (currentMode !== 'admin') return;
                e.preventDefault();
                const title = document.getElementById('linkTitle').value.trim();
                const url = document.getElementById('linkUrl').value.trim();
                const desc = document.getElementById('linkDesc').value.trim();
                const tags = document.getElementById('linkTags').value.split(',').map(s => s.trim()).filter(Boolean);
                if (!title || !url) {
                    alert('标题和网址为必填项');
                    return;
                }
                createNewLink(title, url, desc, tags);
                linkModal.classList.remove('open');
                renderPostList(document.getElementById('searchInput').value);
            });

            // ============================================================
            // 8. 个人中心模态框（仅管理员可打开，但入口已隐藏）
            // ============================================================
            const profileModal = document.getElementById('profileModal');
            const openProfileBtns = [document.getElementById('navProfile'), document.getElementById('navProfileMobile')];
            const closeProfileBtn = document.getElementById('closeProfileModal');

            function openProfileModal() {
                if (currentMode !== 'admin') return;
                document.getElementById('profileName').value = profile.name || '';
                document.getElementById('profileBioInput').value = profile.bio || '';
                document.getElementById('profileAvatarInput').value = profile.avatar || '';
                profileModal.classList.add('open');
            }

            openProfileBtns.forEach(btn => {
                btn.addEventListener('click', openProfileModal);
            });

            closeProfileBtn.addEventListener('click', function() {
                profileModal.classList.remove('open');
            });

            profileModal.addEventListener('click', function(e) {
                if (e.target === this) profileModal.classList.remove('open');
            });

            document.getElementById('profileForm').addEventListener('submit', function(e) {
                if (currentMode !== 'admin') return;
                e.preventDefault();
                const newProfile = {
                    name: document.getElementById('profileName').value.trim() || '山月',
                    bio: document.getElementById('profileBioInput').value.trim() || '🌿 前端开发者 · 写作爱好者',
                    avatar: document.getElementById('profileAvatarInput').value.trim() ||
                        'https://picsum.photos/seed/profile/200/200'
                };
                profile = newProfile;
                saveData('blog_profile', profile);
                updateProfileUI();
                profileModal.classList.remove('open');
            });

            // ============================================================
            // 9. 导出功能（仅管理员）
            // ============================================================
            document.getElementById('exportBtn').addEventListener('click', function() {
                if (currentMode !== 'admin') return;
                const currentPosts = posts;
                const currentProfile = profile;

                const htmlContent = document.documentElement.outerHTML;

                const injectScript = `
                        <script>
                            (function() {
                                const EMBEDDED_POSTS = ${JSON.stringify(currentPosts)};
                                const EMBEDDED_PROFILE = ${JSON.stringify(currentProfile)};
                                try {
                                    localStorage.setItem('blog_posts', JSON.stringify(EMBEDDED_POSTS));
                                    localStorage.setItem('blog_profile', JSON.stringify(EMBEDDED_PROFILE));
                                    console.log('✅ 已从导出文件中加载数据，共 ' + EMBEDDED_POSTS.length + ' 条内容');
                                } catch(e) {
                                    console.warn('⚠️ 写入 localStorage 失败:', e);
                                }
                            })();
                        <\/script>
                    `;

                let finalHtml = htmlContent.replace('</head>', injectScript + '</head>');

                const blob = new Blob([finalHtml], { type: 'text/html; charset=utf-8' });
                const url = URL.createObjectURL(blob);

                const link = document.createElement('a');
                link.href = url;
                const fileName = `博客_${new Date().toISOString().slice(0,10)}.html`;
                link.download = fileName;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);

                setTimeout(() => {
                    URL.revokeObjectURL(url);
                }, 5000);

                const btn = this;
                const originalText = btn.innerHTML;
                btn.innerHTML = '<i class="fas fa-check"></i> 已导出！';
                btn.style.background = '#2e7d32';
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.style.background = '';
                }, 2500);
            });

            // ============================================================
            // 10. 搜索
            // ============================================================
            const searchInput = document.getElementById('searchInput');
            const searchInputMobile = document.getElementById('searchInputMobile');

            function handleSearch(e) {
                const val = e.target.value;
                searchInput.value = val;
                searchInputMobile.value = val;
                if (document.getElementById('page-home').classList.contains('active')) {
                    renderPostList(val);
                } else {
                    switchPage('home');
                    renderPostList(val);
                }
            }

            searchInput.addEventListener('input', handleSearch);
            searchInputMobile.addEventListener('input', handleSearch);

            // ============================================================
            // 11. 主题切换
            // ============================================================
            const themeToggle = document.getElementById('themeToggle');
            const themeIcon = document.getElementById('themeIcon');
            const root = document.documentElement;

            const storedTheme = localStorage.getItem('theme');
            if (storedTheme === 'dark') {
                root.setAttribute('data-theme', 'dark');
                themeIcon.className = 'fas fa-sun';
            } else {
                root.removeAttribute('data-theme');
                themeIcon.className = 'fas fa-moon';
            }

            themeToggle.addEventListener('click', function() {
                const isDark = root.hasAttribute('data-theme');
                if (isDark) {
                    root.removeAttribute('data-theme');
                    themeIcon.className = 'fas fa-moon';
                    localStorage.setItem('theme', 'light');
                } else {
                    root.setAttribute('data-theme', 'dark');
                    themeIcon.className = 'fas fa-sun';
                    localStorage.setItem('theme', 'dark');
                }
            });

            // ============================================================
            // 12. 汉堡菜单
            // ============================================================
            const hamburger = document.getElementById('hamburger');
            const navMobile = document.getElementById('navMobile');

            hamburger.addEventListener('click', function() {
                const open = this.classList.toggle('open');
                navMobile.classList.toggle('open');
                this.setAttribute('aria-expanded', open);
            });

            navMobile.querySelectorAll('a').forEach(link => {
                link.addEventListener('click', () => {
                    hamburger.classList.remove('open');
                    navMobile.classList.remove('open');
                    hamburger.setAttribute('aria-expanded', 'false');
                });
            });

            // ============================================================
            // 13. 滚动
            // ============================================================
            const navbar = document.querySelector('.navbar');
            window.addEventListener('scroll', function() {
                const currentScroll = window.pageYOffset || document.documentElement.scrollTop;
                navbar.classList.toggle('scrolled', currentScroll > 20);

                const backTop = document.getElementById('backTop');
                backTop.classList.toggle('visible', currentScroll > 300);

                const scrollHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
                const progress = scrollHeight > 0 ? (currentScroll / scrollHeight) * 100 : 0;
                document.getElementById('progress-bar').style.width = progress + '%';
            });

            document.getElementById('backTop').addEventListener('click', function() {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });

            // ============================================================
            // 14. 打字机
            // ============================================================
            const typewriterText = document.getElementById('typewriterText');
            const phrases = ['🌱 写代码也写诗', '📖 读书与远行', '✨ 探索技术与生活'];
            let phraseIndex = 0,
                charIndex = 0,
                isDeleting = false;

            function typeEffect() {
                const current = phrases[phraseIndex];
                if (!isDeleting) {
                    typewriterText.textContent = current.substring(0, charIndex + 1);
                    charIndex++;
                    if (charIndex === current.length) {
                        isDeleting = true;
                        setTimeout(typeEffect, 2000);
                        return;
                    }
                    setTimeout(typeEffect, 80 + Math.random() * 40);
                } else {
                    typewriterText.textContent = current.substring(0, charIndex - 1);
                    charIndex--;
                    if (charIndex === 0) {
                        isDeleting = false;
                        phraseIndex = (phraseIndex + 1) % phrases.length;
                        setTimeout(typeEffect, 400);
                        return;
                    }
                    setTimeout(typeEffect, 40 + Math.random() * 30);
                }
            }
            setTimeout(typeEffect, 600);

            // ============================================================
            // 15. 导航点击
            // ============================================================
            document.querySelectorAll('.nav-link[data-page]').forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    const page = this.dataset.page;
                    if (page === 'home') {
                        switchPage('home');
                        renderPostList(document.getElementById('searchInput').value);
                        document.getElementById('posts')?.scrollIntoView({ behavior: 'smooth' });
                    }
                });
            });

            document.getElementById('navBrandLink').addEventListener('click', function(e) {
                e.preventDefault();
                switchPage('home');
                renderPostList(document.getElementById('searchInput').value);
            });

            document.getElementById('heroBtn').addEventListener('click', function(e) {
                e.preventDefault();
                switchPage('home');
                renderPostList(document.getElementById('searchInput').value);
                document.getElementById('posts')?.scrollIntoView({ behavior: 'smooth' });
            });

            // ============================================================
            // 16. 新建按钮（管理员）
            // ============================================================
            document.getElementById('addPostBtn').addEventListener('click', function() {
                if (currentMode !== 'admin') return;
                openNewChoiceModal();
            });

            // ============================================================
            // 17. 页面切换
            // ============================================================
            function switchPage(page) {
                document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
                if (page === 'home') {
                    document.getElementById('page-home').classList.add('active');
                    document.getElementById('posts')?.scrollIntoView({ behavior: 'smooth' });
                } else if (page === 'detail') {
                    document.getElementById('page-detail').classList.add('active');
                }
                document.querySelectorAll('.nav-link').forEach(link => {
                    link.classList.toggle('active', link.dataset.page === page);
                });
            }

            // ============================================================
            // 18. 初始化
            // ============================================================
            function initApp() {
                updateProfileUI();
                renderPostList('');
                switchPage('home');
                window.__currentMode = currentMode;
                console.log('🌙 山月集 · 博客已加载，当前模式：' + (currentMode === 'admin' ? '管理员' : '游客'));
                console.log('📝 共 ' + posts.length + ' 条内容');
                if (currentMode === 'guest') {
                    console.log('🔒 游客模式：仅可查看，不可编辑或删除，个人中心入口已隐藏');
                } else {
                    console.log('🔓 管理员模式：可进行所有操作');
                }
                console.log('🔗 文章内容中的 URL 已自动识别，按住 Ctrl 单击可打开');
            }

            // 注意：initApp 在 enterMode 中调用

        })();
    </script>

</body>
</html>
