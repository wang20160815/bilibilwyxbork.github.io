<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>wang201608</title>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ============================================================
               1. CSS 变量（主题色管理）
               ============================================================ */
        :root {
            --bg-body: #f8f6f3;
            --bg-card: #ffffff;
            --bg-nav: rgba(248, 246, 243, 0.80);
            --bg-hero: linear-gradient(135deg, #1a2a6c, #2d4373);
            --text-primary: #2d2a24;
            --text-secondary: #6b6560;
            --text-light: #f0ede8;
            --accent: #4a7cf7;
            --accent-hover: #3a6ae0;
            --border: #e8e4df;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            --shadow-hover: 0 16px 48px rgba(0, 0, 0, 0.14);
            --radius: 16px;
            --transition: 0.30s cubic-bezier(0.4, 0, 0.2, 1);
            --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            --nav-blur: blur(16px);
            --tag-bg: #eef2f7;
            --tag-text: #3a4a6a;
            --modal-overlay: rgba(0, 0, 0, 0.40);
            --link-color: #2e7d32;
        }

        [data-theme="dark"] {
            --bg-body: #16161a;
            --bg-card: #22222a;
            --bg-nav: rgba(22, 22, 26, 0.85);
            --bg-hero: linear-gradient(135deg, #0d1b2a, #1b2d45);
            --text-primary: #e8e4df;
            --text-secondary: #a8a4a0;
            --text-light: #e8e4df;
            --accent: #6b9cf7;
            --accent-hover: #5a8ae6;
            --border: #3a3a42;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.40);
            --shadow-hover: 0 16px 48px rgba(0, 0, 0, 0.60);
            --tag-bg: #2d2d3a;
            --tag-text: #b0c4e8;
            --modal-overlay: rgba(0, 0, 0, 0.70);
            --link-color: #81c784;
        }

        /* ============================================================
               2. 全局重置 & 基础样式
               ============================================================ */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font);
            background-color: var(--bg-body);
            color: var(--text-primary);
            line-height: 1.8;
            font-size: 16px;
            transition: background-color var(--transition), color var(--transition);
            padding-top: 72px;
        }

        a {
            color: var(--accent);
            text-decoration: none;
            transition: color var(--transition);
        }
        a:hover {
            color: var(--accent-hover);
        }

        img {
            max-width: 100%;
            display: block;
        }

        .container {
            max-width: 1160px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* ============================================================
               3. 顶部加载进度条
               ============================================================ */
        #progress-bar {
            position: fixed;
            top: 0;
            left: 0;
            height: 3px;
            background: var(--accent);
            z-index: 9999;
            width: 0%;
            transition: width 0.10s linear;
            box-shadow: 0 0 8px rgba(74, 124, 247, 0.50);
        }

        /* ============================================================
               4. 导航栏
               ============================================================ */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            padding: 0 24px;
            height: 72px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-nav);
            backdrop-filter: var(--nav-blur);
            -webkit-backdrop-filter: var(--nav-blur);
            border-bottom: 1px solid var(--border);
            transition: background var(--transition), border-color var(--transition), box-shadow var(--transition);
        }
        .navbar.scrolled {
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
        }
        [data-theme="dark"] .navbar.scrolled {
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.30);
        }

        .nav-brand {
            font-size: 1.40rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .nav-brand i {
            color: var(--accent);
        }
        .nav-brand a {
            color: inherit;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 28px;
            list-style: none;
        }
        .nav-links a {
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-secondary);
            position: relative;
            transition: color var(--transition);
            cursor: pointer;
        }
        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--accent);
            transition: width var(--transition);
        }
        .nav-links a:hover {
            color: var(--text-primary);
        }
        .nav-links a:hover::after {
            width: 100%;
        }
        .nav-links a.active {
            color: var(--text-primary);
        }
        .nav-links a.active::after {
            width: 100%;
        }

        .nav-search {
            position: relative;
            display: flex;
            align-items: center;
        }
        .nav-search input {
            padding: 6px 14px 6px 36px;
            border-radius: 40px;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text-primary);
            font-size: 0.90rem;
            width: 180px;
            transition: all var(--transition);
            outline: none;
        }
        .nav-search input:focus {
            width: 220px;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(74, 124, 247, 0.15);
        }
        .nav-search input::placeholder {
            color: var(--text-secondary);
            opacity: 0.70;
        }
        .nav-search .search-icon {
            position: absolute;
            left: 12px;
            color: var(--text-secondary);
            font-size: 0.90rem;
            pointer-events: none;
        }

        .theme-toggle {
            background: none;
            border: none;
            font-size: 1.30rem;
            cursor: pointer;
            color: var(--text-secondary);
            padding: 4px 8px;
            border-radius: 40px;
            transition: background var(--transition), color var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .theme-toggle:hover {
            background: var(--border);
            color: var(--text-primary);
        }

        .hamburger {
            display: none;
            flex-direction: column;
            gap: 5px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px 4px;
        }
        .hamburger span {
            display: block;
            width: 26px;
            height: 2.5px;
            background: var(--text-primary);
            border-radius: 4px;
            transition: all var(--transition);
            transform-origin: center;
        }
        .hamburger.open span:nth-child(1) {
            transform: translateY(7.5px) rotate(45deg);
        }
        .hamburger.open span:nth-child(2) {
            opacity: 0;
            transform: scaleX(0);
        }
        .hamburger.open span:nth-child(3) {
            transform: translateY(-7.5px) rotate(-45deg);
        }

        .nav-mobile {
            display: none;
            flex-direction: column;
            gap: 12px;
            padding: 20px 24px 28px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            position: fixed;
            top: 72px;
            left: 0;
            width: 100%;
            z-index: 999;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.10);
            transition: all var(--transition);
            transform: translateY(-8px);
            opacity: 0;
            pointer-events: none;
        }
        .nav-mobile.open {
            display: flex;
            transform: translateY(0);
            opacity: 1;
            pointer-events: auto;
        }
        .nav-mobile a {
            font-size: 1.05rem;
            color: var(--text-secondary);
            padding: 6px 0;
            border-bottom: 1px solid var(--border);
            transition: color var(--transition);
            cursor: pointer;
        }
        .nav-mobile a:hover {
            color: var(--text-primary);
        }

        /* 游客模式下隐藏个人中心按钮 */
        .mode-guest .nav-links #navProfile,
        .mode-guest .nav-mobile #navProfileMobile {
            display: none !important;
        }

        /* ============================================================
               5. Hero 区域
               ============================================================ */
        .hero {
            background: var(--bg-hero);
            padding: 60px 0 64px;
            border-radius: 0 0 40px 40px;
            margin: 0 12px 40px;
            text-align: center;
            color: #fff;
            position: relative;
            overflow: hidden;
            transition: background var(--transition);
        }
        .hero::after {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 400px;
            height: 400px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 50%;
            pointer-events: none;
        }
        .hero .container {
            position: relative;
            z-index: 1;
        }
        .hero-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255, 255, 255, 0.30);
            margin-bottom: 18px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.20);
            display: inline-block;
        }
        .hero h1 {
            font-size: 2.60rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            margin-bottom: 8px;
        }
        .hero .subtitle {
            font-size: 1.15rem;
            opacity: 0.85;
            font-weight: 400;
            max-width: 540px;
            margin: 0 auto 20px;
        }
        .hero .typewriter {
            display: inline-block;
            font-weight: 500;
            color: #fff;
            background: rgba(255, 255, 255, 0.10);
            padding: 2px 20px 2px 18px;
            border-radius: 40px;
            font-size: 1.05rem;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .hero .typewriter .cursor {
            display: inline-block;
            width: 2px;
            height: 1.1em;
            background: #fff;
            margin-left: 4px;
            vertical-align: text-bottom;
            animation: blink 0.90s step-end infinite;
        }
        @keyframes blink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0;
            }
        }

        .hero .btn-primary {
            display: inline-block;
            margin-top: 22px;
            padding: 12px 40px;
            background: #fff;
            color: #1a2a6c;
            font-weight: 600;
            border-radius: 40px;
            font-size: 1.00rem;
            transition: all var(--transition);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
            border: none;
            cursor: pointer;
        }
        .hero .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.20);
            background: #f0f4ff;
        }

        /* ============================================================
               6. 主内容区 (文章列表)
               ============================================================ */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 40px;
            margin-bottom: 60px;
            align-items: start;
        }

        .post-list {
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        /* 列表头部（标题 + 新建按钮） */
        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .list-header h2 {
            font-size: 1.40rem;
            font-weight: 700;
            color: var(--text-primary);
        }
        .list-header .btn-add {
            padding: 8px 20px;
            border-radius: 40px;
            border: none;
            background: var(--accent);
            color: #fff;
            font-size: 1.00rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 12px rgba(74, 124, 247, 0.25);
        }
        .list-header .btn-add:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(74, 124, 247, 0.35);
        }
        /* 游客模式下隐藏新建按钮 */
        .mode-guest .list-header .btn-add {
            display: none !important;
        }

        /* 卡片列表容器 */
        #postItems {
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        .post-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 28px 32px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            transition: all var(--transition);
            cursor: pointer;
            animation: fadeUp 0.60s ease forwards;
            opacity: 0;
            transform: translateY(20px);
            position: relative;
        }
        .post-card:nth-child(1) {
            animation-delay: 0.05s;
        }
        .post-card:nth-child(2) {
            animation-delay: 0.12s;
        }
        .post-card:nth-child(3) {
            animation-delay: 0.19s;
        }
        .post-card:nth-child(4) {
            animation-delay: 0.26s;
        }
        .post-card:nth-child(5) {
            animation-delay: 0.33s;
        }
        .post-card:nth-child(6) {
            animation-delay: 0.40s;
        }

        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .post-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-hover);
            border-color: var(--accent);
        }

        .post-card .post-meta {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px 18px;
            font-size: 0.88rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }
        .post-card .post-meta .date {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .post-card .post-meta .date i {
            font-size: 0.80rem;
        }
        .post-card .post-meta .read-time {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .post-card .post-meta .read-time i {
            font-size: 0.80rem;
        }
        .post-card .post-meta .link-badge {
            background: var(--link-color);
            color: #fff;
            padding: 0 12px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .post-card h2 {
            font-size: 1.40rem;
            font-weight: 700;
            margin-bottom: 8px;
            line-height: 1.4;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .post-card h2 a {
            color: var(--text-primary);
            transition: color var(--transition);
        }
        .post-card h2 a:hover {
            color: var(--accent);
        }
        .post-card h2 .external-icon {
            font-size: 0.90rem;
            color: var(--text-secondary);
            opacity: 0.60;
        }

        .post-card .post-excerpt {
            color: var(--text-secondary);
            font-size: 0.98rem;
            margin-bottom: 14px;
            line-height: 1.7;
        }

        .post-card .post-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .post-card .post-tags .tag {
            display: inline-block;
            padding: 2px 14px;
            border-radius: 40px;
            font-size: 0.78rem;
            font-weight: 500;
            background: var(--tag-bg);
            color: var(--tag-text);
            transition: all var(--transition);
        }
        .post-card .post-tags .tag:hover {
            background: var(--accent);
            color: #fff;
            transform: translateY(-1px);
        }

        /* 无结果提示（在列表内） */
        .no-results-inline {
            text-align: center;
            padding: 48px 20px;
            color: var(--text-secondary);
            font-size: 1.05rem;
            background: var(--bg-card);
            border-radius: var(--radius);
            border: 1px dashed var(--border);
        }
        .no-results-inline i {
            font-size: 2.40rem;
            display: block;
            margin-bottom: 12px;
            opacity: 0.50;
        }

        /* 侧边栏 */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        .sidebar-widget {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 24px 26px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            transition: background var(--transition), border-color var(--transition);
        }
        .sidebar-widget h3 {
            font-size: 1.10rem;
            font-weight: 700;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-primary);
        }
        .sidebar-widget h3 i {
            color: var(--accent);
            font-size: 1.00rem;
        }

        .profile-widget {
            text-align: center;
        }
        .profile-widget .avatar {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 12px;
            border: 3px solid var(--accent);
            box-shadow: 0 4px 16px rgba(74, 124, 247, 0.20);
        }
        .profile-widget .name {
            font-size: 1.20rem;
            font-weight: 700;
        }
        .profile-widget .bio {
            font-size: 0.92rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .hot-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .hot-list li {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.95rem;
        }
        .hot-list li .rank {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--tag-bg);
            color: var(--text-secondary);
            font-size: 0.75rem;
            font-weight: 700;
            flex-shrink: 0;
        }
        .hot-list li .rank.top {
            background: var(--accent);
            color: #fff;
        }
        .hot-list li a {
            color: var(--text-secondary);
            transition: color var(--transition);
            cursor: pointer;
        }
        .hot-list li a:hover {
            color: var(--accent);
        }

        .tag-cloud {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .tag-cloud .tag {
            padding: 4px 16px;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 500;
            background: var(--tag-bg);
            color: var(--tag-text);
            transition: all var(--transition);
            cursor: default;
        }
        .tag-cloud .tag:hover {
            background: var(--accent);
            color: #fff;
            transform: translateY(-2px);
        }

        /* ============================================================
               7. 页面切换 (SPA 视图)
               ============================================================ */
        .page {
            display: none;
        }
        .page.active {
            display: block;
        }

        /* ============================================================
               8. 文章详情 & 编辑
               ============================================================ */
        .post-detail {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 40px 44px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            margin-bottom: 40px;
        }
        .post-detail .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: color var(--transition);
        }
        .post-detail .back-link:hover {
            color: var(--accent);
        }
        .post-detail .post-title {
            font-size: 2.20rem;
            font-weight: 700;
            margin-bottom: 12px;
        }
        .post-detail .post-meta {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
        }
        .post-detail .post-content {
            font-size: 1.05rem;
            line-height: 1.9;
            color: var(--text-primary);
            white-space: pre-wrap;
            word-break: break-word;
        }
        .post-detail .post-content p {
            margin-bottom: 1em;
        }
        .post-detail .post-actions {
            margin-top: 28px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .post-detail .post-actions button {
            padding: 8px 24px;
            border-radius: 40px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition);
            background: var(--accent);
            color: #fff;
        }
        .post-detail .post-actions button:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
        }
        .post-detail .post-actions button.btn-danger {
            background: #e74c3c;
        }
        .post-detail .post-actions button.btn-danger:hover {
            background: #c0392b;
        }
        .post-detail .post-actions button.btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
        }
        .post-detail .post-actions button.btn-outline:hover {
            background: var(--border);
            color: var(--text-primary);
        }
        .post-detail .post-actions .btn-link-visit {
            background: var(--link-color);
        }
        .post-detail .post-actions .btn-link-visit:hover {
            background: #1b5e20;
        }
        /* 游客模式下隐藏编辑、删除、新建按钮（访问链接按钮保留） */
        .mode-guest .post-detail .post-actions button:not(.btn-link-visit) {
            display: none !important;
        }
        .mode-guest .post-detail .post-actions a.btn-link-visit {
            /* 保留访问链接按钮 */;
        }

        /* 编辑表单（游客模式下完全隐藏） */
        .mode-guest .edit-form,
        .mode-guest #editFormContainer {
            display: none !important;
        }

        /* ============================================================
               9. 模态框通用样式
               ============================================================ */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--modal-overlay);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            backdrop-filter: blur(4px);
        }
        .modal-overlay.open {
            display: flex;
        }
        .modal {
            background: var(--bg-card);
            border-radius: var(--radius);
            max-width: 560px;
            width: 100%;
            padding: 36px 40px;
            box-shadow: var(--shadow-hover);
            border: 1px solid var(--border);
            position: relative;
            animation: modalIn 0.30s ease;
        }
        @keyframes modalIn {
            from {
                transform: scale(0.94) translateY(20px);
                opacity: 0;
            }
            to {
                transform: scale(1) translateY(0);
                opacity: 1;
            }
        }
        .modal .close-modal {
            position: absolute;
            top: 16px;
            right: 20px;
            background: none;
            border: none;
            font-size: 1.60rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: color var(--transition);
        }
        .modal .close-modal:hover {
            color: var(--text-primary);
        }
        .modal h2 {
            font-size: 1.60rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .modal h2 i {
            color: var(--accent);
        }
        .modal .form-group {
            margin-bottom: 16px;
        }
        .modal .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--text-secondary);
        }
        .modal .form-group input,
        .modal .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg-body);
            color: var(--text-primary);
            font-size: 1.00rem;
            transition: border-color var(--transition);
            outline: none;
            font-family: var(--font);
        }
        .modal .form-group input:focus,
        .modal .form-group textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(74, 124, 247, 0.15);
        }
        .modal .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }
        .modal .btn-primary {
            padding: 10px 32px;
            border-radius: 40px;
            border: none;
            background: var(--accent);
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition);
            margin-top: 8px;
        }
        .modal .btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
        }
        .modal .btn-secondary {
            padding: 10px 32px;
            border-radius: 40px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-secondary);
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition);
            margin-top: 8px;
            margin-left: 12px;
        }
        .modal .btn-secondary:hover {
            background: var(--border);
            color: var(--text-primary);
        }
        .modal .choice-grid {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin: 20px 0 10px;
            flex-wrap: wrap;
        }
        .modal .choice-btn {
            flex: 1;
            min-width: 140px;
            padding: 24px 16px;
            border-radius: var(--radius);
            border: 2px solid var(--border);
            background: var(--bg-body);
            cursor: pointer;
            transition: all var(--transition);
            text-align: center;
            font-size: 1.10rem;
            font-weight: 600;
            color: var(--text-primary);
        }
        .modal .choice-btn i {
            display: block;
            font-size: 2.40rem;
            margin-bottom: 10px;
            color: var(--accent);
        }
        .modal .choice-btn:hover {
            border-color: var(--accent);
            background: var(--bg-card);
            transform: translateY(-4px);
            box-shadow: var(--shadow);
        }

        /* 导出按钮特殊样式 */
        .export-section {
            border-top: 1px solid var(--border);
            padding-top: 20px;
            margin-top: 16px;
        }
        .export-section .btn-export {
            padding: 10px 32px;
            border-radius: 40px;
            border: none;
            background: var(--link-color);
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .export-section .btn-export:hover {
            background: #1b5e20;
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(46, 125, 50, 0.30);
        }
        .export-section .hint {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 8px;
        }
        /* 游客模式下隐藏导出按钮 */
        .mode-guest .export-section .btn-export {
            display: none !important;
        }

        /* ============================================================
               10. 回到顶部按钮
               ============================================================ */
        .back-top {
            position: fixed;
            bottom: 36px;
            right: 36px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--accent);
            color: #fff;
            border: none;
            font-size: 1.20rem;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(74, 124, 247, 0.35);
            transition: all var(--transition);
            opacity: 0;
            visibility: hidden;
            transform: translateY(16px);
            z-index: 900;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .back-top.visible {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
        .back-top:hover {
            background: var(--accent-hover);
            transform: translateY(-4px);
            box-shadow: 0 8px 32px rgba(74, 124, 247, 0.45);
        }

        /* ============================================================
               11. 页脚
               ============================================================ */
        .footer {
            background: var(--bg-card);
            border-top: 1px solid var(--border);
            padding: 40px 0 32px;
            margin-top: 20px;
            transition: background var(--transition), border-color var(--transition);
        }
        .footer .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }
        .footer .copy {
            font-size: 0.92rem;
            color: var(--text-secondary);
        }
        .footer .socials {
            display: flex;
            gap: 18px;
        }
        .footer .socials a {
            color: var(--text-secondary);
            font-size: 1.30rem;
            transition: all var(--transition);
        }
        .footer .socials a:hover {
            color: var(--accent);
            transform: translateY(-2px);
        }

        /* ============================================================
               12. 响应式
               ============================================================ */
        @media (max-width: 1023px) {
            .main-grid {
                grid-template-columns: 1fr;
                gap: 32px;
            }
            .sidebar {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
                gap: 24px;
            }
            .hero h1 {
                font-size: 2.20rem;
            }
            .nav-search input {
                width: 140px;
            }
            .nav-search input:focus {
                width: 170px;
            }
        }

        @media (max-width: 767px) {
            body {
                padding-top: 64px;
            }
            .navbar {
                height: 64px;
                padding: 0 16px;
            }
            .nav-links {
                display: none;
            }
            .hamburger {
                display: flex;
            }
            .nav-search {
                display: none;
            }
            .nav-mobile .nav-search {
                display: flex;
            }
            .hero {
                padding: 40px 0 44px;
                margin: 0 8px 28px;
                border-radius: 0 0 28px 28px;
            }
            .hero h1 {
                font-size: 1.80rem;
            }
            .hero .subtitle {
                font-size: 1.00rem;
            }
            .hero .typewriter {
                font-size: 0.90rem;
                padding: 2px 14px;
            }
            .post-card {
                padding: 20px 18px;
            }
            .post-card h2 {
                font-size: 1.20rem;
            }
            .sidebar {
                grid-template-columns: 1fr;
            }
            .footer .container {
                flex-direction: column;
                text-align: center;
            }
            .back-top {
                bottom: 20px;
                right: 20px;
                width: 42px;
                height: 42px;
                font-size: 1.00rem;
            }
            .container {
                padding: 0 16px;
            }
            .post-detail {
                padding: 24px 18px;
            }
            .post-detail .post-title {
                font-size: 1.60rem;
            }
            .modal {
                padding: 24px 20px;
            }
            .list-header {
                flex-direction: row;
                flex-wrap: wrap;
            }
            .list-header .btn-add {
                font-size: 0.90rem;
                padding: 6px 16px;
            }
            .modal .choice-btn {
                min-width: 100px;
                padding: 16px 12px;
                font-size: 1.00rem;
            }
            .modal .choice-btn i {
                font-size: 1.80rem;
            }
            /* 游客模式隐藏新建按钮在移动端也生效 */
            .mode-guest .list-header .btn-add {
                display: none !important;
            }
            /* 游客模式隐藏个人中心按钮（移动端） */
            .mode-guest .nav-mobile #navProfileMobile {
                display: none !important;
            }
        }

        @media (max-width: 400px) {
            .hero h1 {
                font-size: 1.50rem;
            }
            .post-card .post-meta {
                font-size: 0.80rem;
                gap: 8px 12px;
            }
        }

        /* ============================================================
               13. 辅助工具
               ============================================================ */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }
        a:focus-visible,
        button:focus-visible,
        input:focus-visible,
        textarea:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        /* ============================================================
               14. 模式选择覆盖层
               ============================================================ */
        #mode-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(8px);
            z-index: 99999;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease;
        }
        #mode-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .mode-box {
            background: var(--bg-card);
            border-radius: var(--radius);
            max-width: 480px;
            width: 90%;
            padding: 40px 36px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.30);
            border: 1px solid var(--border);
        }
        .mode-box h1 {
            font-size: 2.00rem;
            margin-bottom: 8px;
            color: var(--text-primary);
        }
        .mode-box .sub {
            color: var(--text-secondary);
            margin-bottom: 28px;
            font-size: 1.00rem;
        }
        .mode-box .mode-buttons {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .mode-box .mode-btn {
            padding: 12px 32px;
            border-radius: 40px;
            border: 2px solid var(--border);
            background: var(--bg-body);
            color: var(--text-primary);
            font-size: 1.10rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition);
            flex: 1;
            min-width: 120px;
        }
        .mode-box .mode-btn i {
            margin-right: 8px;
        }
        .mode-box .mode-btn:hover {
            border-color: var(--accent);
            background: var(--bg-card);
            transform: translateY(-3px);
            box-shadow: var(--shadow);
        }
        .mode-box .mode-btn.admin {
            border-color: var(--accent);
            background: var(--accent);
            color: #fff;
        }
        .mode-box .mode-btn.admin:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
        }
        .mode-box .password-area {
            margin-top: 20px;
            display: none;
            flex-direction: column;
            gap: 12px;
            align-items: center;
        }
        .mode-box .password-area.show {
            display: flex;
        }
        .mode-box .password-area input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 40px;
            border: 1px solid var(--border);
            background: var(--bg-body);
            color: var(--text-primary);
            font-size: 1.00rem;
            outline: none;
            transition: border-color var(--transition);
        }
        .mode-box .password-area input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(74, 124, 247, 0.15);
        }
        .mode-box .password-area .pw-actions {
            display: flex;
            gap: 12px;
            width: 100%;
        }
        .mode-box .password-area .pw-actions button {
            flex: 1;
            padding: 10px 0;
            border-radius: 40px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition);
        }
        .mode-box .password-area .pw-actions .confirm-btn {
            background: var(--accent);
            color: #fff;
        }
        .mode-box .password-area .pw-actions .confirm-btn:hover {
            background: var(--accent-hover);
        }
        .mode-box .password-area .pw-actions .cancel-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
        }
        .mode-box .password-area .pw-actions .cancel-btn:hover {
            background: var(--border);
        }
        .mode-box .error-msg {
            color: #e74c3c;
            font-size: 0.90rem;
            margin-top: 4px;
            display: none;
        }
        .mode-box .error-msg.show {
            display: block;
        }

        /* 隐藏主内容直到模式选择完成 */
        #main-content {
            display: none;
        }
        #main-content.show {
            display: block;
        }

        /* ===== 新增：文章内容中的链接样式 ===== */
        .url-link {
            color: var(--accent);
            text-decoration: underline;
            cursor: pointer;
            border-bottom: 1px dashed var(--accent);
            transition: background 0.2s;
            font-weight: 500;
        }
        .url-link:hover {
            background: rgba(74, 124, 247, 0.15);
        }
        .url-link:active {
            background: rgba(74, 124, 247, 0.30);
        }
    </style>
</head>
<body>

    <!-- ===== 模式选择覆盖层 ===== -->
    <div id="mode-overlay">
        <div class="mode-box">
            <h1><i class="fas fa-mountain" style="color:var(--accent);"></i> 山月集</h1>
            <p class="sub">选择进入模式</p>
            <div class="mode-buttons">
                <button class="mode-btn" id="guestModeBtn"><i class="fas fa-eye"></i> 游客模式</button>
                <button class="mode-btn admin" id="adminModeBtn"><i class="fas fa-user-cog"></i> 管理员</button>
            </div>
            <div class="password-area" id="passwordArea">
                <input type="password" id="adminPassword" placeholder="请输入管理员密码" />
                <div class="error-msg" id="pwError">密码错误，请重试</div>
                <div class="pw-actions">
                    <button class="confirm-btn" id="confirmPwBtn">确认</button>
                    <button class="cancel-btn" id="cancelPwBtn">取消</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== 主内容（所有页面） ===== -->
    <div id="main-content">

        <!-- 加载进度条 -->
        <div id="progress-bar" role="progressbar" aria-label="页面加载进度"></div>

        <!-- ===== 导航栏 ===== -->
        <nav class="navbar" role="navigation" aria-label="主导航">
            <div class="nav-brand">
                <i class="fas fa-mountain"></i>
                <a href="#" id="navBrandLink">山月集</a>
            </div>

            <ul class="nav-links">
                <li><a class="nav-link active" data-page="home">首页</a></li>
                <li><a class="nav-link" data-page="home">文章</a></li>
                <li><a class="nav-link" id="navProfile" style="cursor:pointer;">个人中心</a></li>
                <li><a class="nav-link" data-page="home">联系</a></li>
            </ul>

            <div style="display:flex;align-items:center;gap:12px;">
                <div class="nav-search" role="search">
                    <i class="fas fa-search search-icon" aria-hidden="true"></i>
                    <input type="text" id="searchInput" placeholder="搜索文章…" aria-label="搜索文章" autocomplete="off" />
                </div>
                <button class="theme-toggle" id="themeToggle" aria-label="切换亮色/暗色模式" title="切换主题">
                    <i class="fas fa-moon" id="themeIcon"></i>
                </button>
                <button class="hamburger" id="hamburger" aria-label="展开菜单" aria-expanded="false">
                    <span></span><span></span><span></span>
                </button>
            </div>
        </nav>

        <!-- 移动端导航 -->
        <div class="nav-mobile" id="navMobile" role="navigation" aria-label="移动端导航">
            <a class="nav-link" data-page="home">首页</a>
            <a class="nav-link" data-page="home">文章</a>
            <a id="navProfileMobile" style="cursor:pointer;">个人中心</a>
            <a class="nav-link" data-page="home">联系</a>
            <div class="nav-search" role="search">
                <i class="fas fa-search search-icon" aria-hidden="true"></i>
                <input type="text" id="searchInputMobile" placeholder="搜索文章…" aria-label="搜索文章" autocomplete="off" />
            </div>
        </div>

        <!-- ===== Hero 区域 ===== -->
        <header class="hero" id="about">
            <div class="container">
                <img class="hero-avatar" id="heroAvatar" src="https://picsum.photos/seed/avatar/200/200" alt="博主头像" loading="lazy" width="100" height="100" />
                <h1 id="heroName">山月集</h1>
                <p class="subtitle" id="heroBio">写代码也写诗 · 在技术与文字之间漫步</p>
                <div class="typewriter" aria-label="动态自我介绍">
                    <span id="typewriterText"></span><span class="cursor" aria-hidden="true"></span>
                </div>
                <a href="#" class="btn-primary" id="heroBtn">开始阅读 <i class="fas fa-arrow-right" style="margin-left:6px;"></i></a>
            </div>
        </header>

        <!-- ===== 主容器 ===== -->
        <main class="container">

            <!-- 页面：首页 (文章列表) -->
            <div class="page active" id="page-home">
                <div class="main-grid">
                    <section class="post-list">
                        <!-- 列表头部 -->
                        <div class="list-header">
                            <h2><i class="fas fa-pen-fancy" style="color:var(--accent);margin-right:8px;"></i>文章</h2>
                            <button class="btn-add" id="addPostBtn"><i class="fas fa-plus"></i> 新建</button>
                        </div>
                        <!-- 卡片容器 -->
                        <div id="postItems">
                            <!-- 由 JavaScript 渲染 -->
                        </div>
                    </section>

                    <aside class="sidebar" aria-label="侧边栏">
                        <div class="sidebar-widget profile-widget" id="sidebarProfile">
                            <img class="avatar" id="sidebarAvatar" src="https://picsum.photos/seed/profile/200/200" alt="博主头像" loading="lazy" width="88" height="88" />
                            <div class="name" id="sidebarName">山月</div>
                            <div class="bio" id="sidebarBio">🌿 前端开发者 · 写作爱好者</div>
                            <div style="margin-top:6px;font-size:0.85rem;color:var(--text-secondary);">
                                <i class="fas fa-map-pin"></i> 杭州 · 晴
                            </div>
                        </div>

                        <div class="sidebar-widget">
                            <h3><i class="fas fa-fire"></i> 热门文章</h3>
                            <ul class="hot-list" id="hotList"></ul>
                        </div>

                        <div class="sidebar-widget">
                            <h3><i class="fas fa-tags"></i> 分类标签</h3>
                            <div class="tag-cloud" id="tagCloud"></div>
                        </div>
                    </aside>
                </div>
            </div>

            <!-- 页面：文章详情 + 编辑 -->
            <div class="page" id="page-detail">
                <div id="postDetailContainer">
                    <!-- 由 JavaScript 渲染 -->
                </div>
            </div>

        </main>

        <!-- ===== 个人中心模态框（游客模式下入口隐藏，但模态框本身不显示） ===== -->
        <div class="modal-overlay" id="profileModal">
            <div class="modal" role="dialog" aria-labelledby="profileModalTitle">
                <button class="close-modal" id="closeProfileModal" aria-label="关闭个人中心">&times;</button>
                <h2 id="profileModalTitle"><i class="fas fa-user-cog"></i> 个人中心</h2>
                <form id="profileForm">
                    <div class="form-group">
                        <label for="profileName">昵称</label>
                        <input type="text" id="profileName" placeholder="输入昵称" />
                    </div>
                    <div class="form-group">
                        <label for="profileBio">个人简介</label>
                        <input type="text" id="profileBioInput" placeholder="一句话介绍自己" />
                    </div>
                    <div class="form-group">
                        <label for="profileAvatar">头像 URL</label>
                        <input type="text" id="profileAvatarInput" placeholder="https://example.com/avatar.jpg" />
                    </div>
                    <button type="submit" class="btn-primary">保存修改</button>
                </form>

                <!-- 导出区域（仅管理员可见） -->
                <div class="export-section" id="exportSection">
                    <button class="btn-export" id="exportBtn"><i class="fas fa-file-download"></i> 导出博客</button>
                    <div class="hint">将当前所有文章、链接和个人信息导出为一个独立的 HTML 文件，方便分享或备份。</div>
                </div>
            </div>
        </div>

        <!-- ===== 新建选择模态框（仅管理员使用，游客不可见） ===== -->
        <div class="modal-overlay" id="newChoiceModal">
            <div class="modal" role="dialog" aria-labelledby="newChoiceTitle">
                <button class="close-modal" id="closeChoiceModal" aria-label="关闭">&times;</button>
                <h2 id="newChoiceTitle"><i class="fas fa-plus-circle"></i> 新建内容</h2>
                <p style="color:var(--text-secondary);margin-bottom:12px;">选择要创建的类型：</p>
                <div class="choice-grid">
                    <button class="choice-btn" id="choicePost">
                        <i class="fas fa-file-alt"></i>

                content: '《百年孤独》是我读过最魔幻也最现实的小说。布恩迪亚家族七代人的故事，像是人类历史的缩影。\n\n最触动我的是奥雷里亚诺上校，他发动三十二场战争全部失败，最终在作坊里制作小金鱼，做完又融掉重做。这种循环往复的孤独，何尝不是我们每个人的宿命？但正是这种重复，赋予了生命以重量。',

                content: '我坚持写作三年，最大的收获不是粉丝或稿费，而是思考方式的改变。\n\n写作迫使我梳理逻辑，把模糊的感觉变成清晰的语言。刚开始很难，经常写了删、删了写。但慢慢地，我发现自己的表达能力提升了，看待问题也更深入。写作是一种修行，值得每个人尝试。',

                content: '第一次按下胶片相机的快门时，我听到了机械的清脆声响。那一刻，我突然理解了什么叫“仪式感”。\n\n胶片摄影不能即时回放，你必须认真对待每一张底片。测光、构图、对焦，每个步骤都小心翼翼。等待冲扫的那几天，期待感让人兴奋。当拿到成片时，那种颗粒感和色彩，是数码永远无法模拟的。',

                cover: 'https://picsum.photos/seed/film/600/340',
